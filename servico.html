<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Serviço | BESTUDIO Maputo</title><link rel="stylesheet" href="css/bestudio.css"><script src="js/config.js"></script><script src="js/services.js"></script><script src="js/app.js"></script></head><body>
<header><button class="menu" onclick="document.getElementById('drawer').classList.add('open')">≡</button><a class="logo" href="index.html">BESTUDIO</a><a class="icons" href="conta.html">Conta</a></header>
<div class="drawer" id="drawer" onclick="this.classList.remove('open')"><div class="box" onclick="event.stopPropagation()"><a href="index.html">Início</a><a href="servicos.html">Todos os serviços</a><a href="servicos.html?cat=musica">Música</a><a href="servicos.html?cat=podcast">Podcast</a><a href="servicos.html?cat=publicidade">Publicidade</a><a href="conta.html">Minha conta</a></div></div>
<main><div id="detail"></div></main>
<script>
var id = new URLSearchParams(location.search).get("id");
var s = window.bestudio.service(id);
if (!s) { document.getElementById("detail").innerHTML = "<h1>Serviço não encontrado</h1><p><a class='btn' href='servicos.html'>Ver serviços</a></p>"; }
else {
  document.getElementById("detail").innerHTML = '<p class="eyebrow">' + window.BESTUDIO_CATS[s.cat] + ' • Maputo</p><h1>' + s.name + '</h1><div class="card"><img src="' + s.img + '" alt="' + s.name + '"><p style="margin-top:1rem">' + s.desc + '</p><p class="price">' + fmtMT(s.price) + " / " + s.unit + '</p></div>' +
  '<label>Quantidade</label><div class="qty"><button id="minus">−</button><span id="qval">1</span><button id="plus">+</button><span class="muted">' + s.unit + '</span></div>' +
  '<div class="row"><p>Total do serviço</p><p><strong id="total">' + fmtMT(s.price) + '</strong></p></div>' +
  '<div class="note"><p>Taxa de reserva ' + fmtMT(window.bestudio.fee()) + ', que conta para o pagamento final. O resto paga-se no estúdio / na entrega.</p></div>' +
  '<p><button class="btn btn-primary" id="go">Reservar este serviço</button></p><p><a class="linkarrow" href="servicos.html?cat=' + s.cat + '">Mais de ' + window.BESTUDIO_CATS[s.cat] + '</a></p>';
  function setQty(q) { q = Math.max(1, q); document.getElementById("qval").textContent = q; document.getElementById("total").textContent = fmtMT(s.price * q); return q; }
  var curQ = 1;
  document.getElementById("minus").onclick = function () { curQ = setQty(curQ - 1); };
  document.getElementById("plus").onclick = function () { curQ = setQty(curQ + 1); };
  document.getElementById("go").onclick = function () { location.href = "reserva.html?service=" + s.id + "&qty=" + curQ; };
}
</script><footer class="sitefooter">BESTUDIO • Maputo<br><a href="servicos.html">Serviços</a><a href="conta.html">Minha conta</a><a href="chat.html">Chat</a></footer></body></html>
