<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Serviços | BESTUDIO Maputo</title><link rel="stylesheet" href="css/bestudio.css"><script src="js/config.js"></script><script src="js/services.js"></script><script src="js/app.js"></script></head><body>
<header><button class="menu" onclick="document.getElementById('drawer').classList.add('open')">≡</button><a class="logo" href="index.html">BESTUDIO</a><a class="icons" href="conta.html">Conta</a></header>
<div class="drawer" id="drawer" onclick="this.classList.remove('open')"><div class="box" onclick="event.stopPropagation()"><a href="index.html">Início</a><a href="servicos.html">Todos os serviços</a><a href="servicos.html?cat=musica">Música</a><a href="servicos.html?cat=podcast">Podcast</a><a href="servicos.html?cat=publicidade">Publicidade</a><a href="conta.html">Minha conta</a></div></div>
<main><p class="eyebrow">BESTUDIO • Maputo</p><h1 id="title">Serviços</h1><div class="tabs" id="tabs"></div><div class="grid" id="list"></div>
<p><a class="linkarrow" href="index.html">Início</a></p></main>
<script>
var cat = new URLSearchParams(location.search).get("cat") || "all";
document.getElementById("title").textContent = cat === "all" ? "Todos os serviços" : window.BESTUDIO_CATS[cat];
var tabs = document.getElementById("tabs");
[["all","Todos"],["musica","Música"],["podcast","Podcast"],["publicidade","Publicidade"]].forEach(function (t) {
  var b = document.createElement("button"); b.textContent = t[1]; if (t[0] === cat) b.className = "on";
  b.onclick = function () { location.href = "servicos.html" + (t[0] === "all" ? "" : "?cat=" + t[0]); }; tabs.appendChild(b);
});
document.getElementById("list").innerHTML = window.bestudio.services().filter(function (s) { return cat === "all" || s.cat === cat; }).map(function (s) {
  return '<div class="card"><a href="servico.html?id=' + s.id + '" style="text-decoration:none"><img src="' + s.img + '" alt="' + s.name + '"></a><div class="price-row"><h3>' + s.name + '</h3><span class="price">' + fmtMT(s.price) + '</span></div><p class="muted">' + window.BESTUDIO_CATS[s.cat] + ' • ' + s.unit + '</p><p>' + s.desc + '</p><a class="linkarrow" href="servico.html?id=' + s.id + '">Reservar</a></div>';
}).join("");
</script><footer class="sitefooter">BESTUDIO • Maputo<br><a href="servicos.html">Serviços</a><a href="conta.html">Minha conta</a><a href="chat.html">Chat</a></footer></body></html>
