name: Unzip site archive
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and expand site archive
        run: |
          set -e
          curl -sSLf -o bestudio.zip https://github.com/fernanda312/bestudio/releases/download/site-files/bestudio.zip
          test -s bestudio.zip
          unzip -o bestudio.zip
          shopt -s dotglob
          mv bestudio/* .
          rmdir bestudio
          rm -f bestudio.zip
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Publish BESTUDIO site files at repository root"
            git push
          fi
