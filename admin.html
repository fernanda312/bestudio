<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | BESTUDIO Maputo</title><link rel="stylesheet" href="css/bestudio.css"><script src="js/config.js"></script><script src="js/services.js"></script><script src="js/app.js"></script></head><body>
<header><button class="menu" onclick="document.getElementById('drawer').classList.add('open')">≡</button><a class="logo" href="index.html">BESTUDIO</a><a class="icons" href="conta.html">Conta</a></header>
<div class="drawer" id="drawer" onclick="this.classList.remove('open')"><div class="box" onclick="event.stopPropagation()"><a href="index.html">Início</a><a href="servicos.html">Todos os serviços</a><a href="conta.html">Minha conta</a></div></div>
<main><p class="eyebrow">BESTUDIO • Maputo</p><h1>Admin</h1><div id="box"></div></main>
<script>
var s = window.bestudio.session();
var admin = window.bestudio.adminEmail();
if (!s) { document.getElementById("box").innerHTML = "<p>Entra primeiro na tua conta.</p><p><a class='btn btn-primary' href='conta.html'>Entrar</a></p>"; }
else if (!admin) {
  document.getElementById("box").innerHTML = '<label>Email do admin</label><input id="ae" type="email"><p><button class="btn btn-primary" id="set">Definir admin</button></p>';
  document.getElementById("set").onclick = function () { var e = document.getElementById("ae").value.trim(); if (!e) return; localStorage.setItem("bestudio_admin_email", JSON.stringify(e)); location.reload(); };
}
else if (!window.bestudio.isAdmin()) { document.getElementById("box").innerHTML = "<p>Esta página é só para o admin.</p><p><a class='linkarrow' href='conta.html'>Minha conta</a></p>"; }
else {
  function renderBookings() {
    document.getElementById("blist").innerHTML = window.bestudio.bookings().length ? window.bestudio.bookings().map(function (b) {
      return '<div class="booking"><div class="price-row"><p><strong>' + b.serviceName + '</strong></p><span class="badge">' + b.status + '</span></div><p class="muted">' + b.date + ' às ' + b.time + ' • ' + b.email + '</p><p>Projeto: ' + (b.project || "—") + ' • Total: ' + fmtMT(b.total) + ' • Taxa: ' + fmtMT(b.fee) + '</p><p><button class="smallbtn" onclick="window.bestudio.updateBooking(\'' + b.id + '\',{status:\'confirmada\'});location.reload()">Confirmar</button> <button class="smallbtn" onclick="window.bestudio.updateBooking(\'' + b.id + '\',{status:\'paga\'});location.reload()">Marcar como paga</button> <button class="smallbtn danger" onclick="window.bestudio.updateBooking(\'' + b.id + '\',{status:\'cancelada\'});location.reload()">Cancelar</button></p></div>';
    }).join("") : "<p class='muted'>Ainda não há reservas.</p>";
  }
  function renderServices() {
    document.getElementById("slist").innerHTML = window.bestudio.services().map(function (sv) {
      return '<div class="pricerow"><div><strong>' + sv.name + '</strong><p class="muted" style="margin:0">' + window.BESTUDIO_CATS[sv.cat] + '</p></div><input type="number" id="p-' + sv.id + '" value="' + sv.price + '"></div>';
    }).join("");
  }
  function saveAllPrices() {
    var over = {}; try { over = JSON.parse(localStorage.getItem("bestudio_services_override") || "{}"); } catch (e) {}
    window.bestudio.services().forEach(function (sv) { over[sv.id] = { price: parseInt(document.getElementById("p-" + sv.id).value) || 0 }; });
    localStorage.setItem("bestudio_services_override", JSON.stringify(over)); document.getElementById("pricesaved").textContent = "Preços guardados.";
  }
  document.getElementById("box").innerHTML =
    '<p class="muted">' + s.email + '</p>' +
    '<h2>Taxa de reserva</h2><label>Taxa (MT)</label><input type="number" id="fee" value="' + window.bestudio.fee() + '"><p><button class="btn" id="savefee">Guardar taxa</button> <span id="feesaved" class="muted"></span></p>' +
    '<h2>WhatsApp</h2><label>Link do WhatsApp</label><input id="wa" value="' + window.bestudio.whatsappUrl() + '"><p><button class="btn" id="savewa">Guardar link</button> <span id="wasaved" class="muted"></span></p>' +
    '<h2>Reservas</h2><div id="blist"></div><h2>Preços</h2><div id="slist"></div><p><button class="btn" id="saveprices">Guardar preços</button> <span id="pricesaved" class="muted"></span></p>' +
    '<h2>Responder no chat</h2><label>Email do cliente</label><input id="to" placeholder="email do cliente"><label>Mensagem</label><textarea id="rtext"></textarea><p><button class="btn btn-primary" id="reply">Enviar resposta</button> <span id="replysaved" class="muted"></span></p>';
  document.getElementById("savefee").onclick = function () { var v = parseInt(document.getElementById("fee").value) || 0; localStorage.setItem("bestudio_booking_fee", JSON.stringify(v)); document.getElementById("feesaved").textContent = "Guardada."; };
  document.getElementById("savewa").onclick = function () { var v = document.getElementById("wa").value.trim(); if (!v) return; localStorage.setItem("bestudio_whatsapp_url", JSON.stringify(v)); document.getElementById("wasaved").textContent = "Guardado."; };
  document.getElementById("saveprices").onclick = saveAllPrices;
  document.getElementById("reply").onclick = function () { var to = document.getElementById("to").value.trim(), t = document.getElementById("rtext").value.trim(); if (!to || !t) return; window.bestudio.addMessage({ email: to, to: to, from: "studio", text: t }); document.getElementById("rtext").value = ""; document.getElementById("replysaved").textContent = "Enviada."; };
  renderBookings(); renderServices();
}
</script><footer class="sitefooter">BESTUDIO • Maputo<br><a href="servicos.html">Serviços</a><a href="conta.html">Minha conta</a><a href="chat.html">Chat</a></footer></body></html>
