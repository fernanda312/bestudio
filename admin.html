<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | BESTUDIO Maputo</title><link rel="stylesheet" href="css/bestudio.css"><script src="js/config.js"></script><script src="js/services.js"></script><script src="js/app.js"></script></head><body>
<header><button class="menu" onclick="document.getElementById('drawer').classList.add('open')">≡</button><a class="logo" href="index.html">BESTUDIO</a><a class="icons" href="conta.html">○</a></header>
<div class="drawer" id="drawer" onclick="this.classList.remove('open')"><div class="box" onclick="event.stopPropagation()"><a href="index.html">Início</a><a href="servicos.html">Todos os serviços</a><a href="conta.html">Minha conta</a><a href="admin.html">Admin</a></div></div>
<main><p class="eyebrow">Admin • BESTUDIO</p><h1>Admin</h1><div id="box"></div></main>
<script>
var s = window.bestudio.session();
var admin = window.bestudio.adminEmail();
if (!s) { document.getElementById("box").innerHTML = "<p>Entra primeiro na tua conta.</p><p><a class='btn' href='conta.html'>Entrar / Criar conta</a></p>"; }
else if (!admin) {
  document.getElementById("box").innerHTML = '<div class="note"><p><strong>Admin ainda não configurado.</strong> Escreve aqui o email do dono, para testar neste dispositivo. Para produção, esse email deve ficar em js/config.js (ADMIN_EMAIL), para o comprador o trocar pelo dele.</p></div><label>Email do admin</label><input id="ae" type="email"><p><button class="btn btn-primary" id="set">Definir admin neste dispositivo</button></p>';
  document.getElementById("set").onclick = function () { var e = document.getElementById("ae").value.trim(); if (!e) return; localStorage.setItem("bestudio_admin_email", JSON.stringify(e)); location.reload(); };
}
else if (!window.bestudio.isAdmin()) { document.getElementById("box").innerHTML = "<p>Sem acesso. Só o email do admin (" + admin + ") pode abrir esta página.</p><p>Sessão: " + s.email + '</p><p><a class="btn" href="conta.html">Voltar à conta</a></p>'; }
else {
  function renderBookings() {
    document.getElementById("blist").innerHTML = window.bestudio.bookings().length ? window.bestudio.bookings().map(function (b) {
      return '<div class="booking"><p><strong>' + b.serviceName + '</strong> — ' + b.date + ' às ' + b.time + ' • ' + b.email + '</p><p>Projeto: ' + (b.project || "—") + ' • Total: ' + fmtMT(b.total) + ' • Taxa: ' + fmtMT(b.fee) + ' • Estado: ' + b.status + '</p><p><button class="btn" onclick="window.bestudio.updateBooking(\'' + b.id + '\',{status:\'confirmada\'});location.reload()">Confirmar</button> <button class="btn" onclick="window.bestudio.updateBooking(\'' + b.id + '\',{status:\'paga\'});location.reload()">Marcar como paga</button> <button class="btn" onclick="window.bestudio.updateBooking(\'' + b.id + '\',{status:\'cancelada\'});location.reload()">Cancelar</button></p></div>';
    }).join("") : "<p>Ainda não há reservas.</p>";
  }
  function renderServices() {
    document.getElementById("slist").innerHTML = window.bestudio.services().map(function (sv) {
      return '<div class="booking"><p><strong>' + sv.name + '</strong> (' + window.BESTUDIO_CATS[sv.cat] + ')</p><label>Preço MT</label><input type="number" id="p-' + sv.id + '" value="' + sv.price + '"><p><button class="btn" onclick="savePrice(\'' + sv.id + '\')">Guardar preço</button></p></div>';
    }).join("");
  }
  window.savePrice = function (id) {
    var over = {}; try { over = JSON.parse(localStorage.getItem("bestudio_services_override") || "{}"); } catch (e) {}
    over[id] = { price: parseInt(document.getElementById("p-" + id).value) || 0 }; localStorage.setItem("bestudio_services_override", JSON.stringify(over)); location.reload();
  };
  document.getElementById("box").innerHTML =
    '<p>Admin: <strong>' + s.email + '</strong> • Taxa de reserva atual: ' + fmtMT(window.bestudio.fee()) + ' (muda-se em js/config.js, BOOKING_FEE)</p>' +
    '<div class="note"><p><strong>Ligação por fazer:</strong> projeto Supabase + chaves do fornecedor M-Pesa. Sem isso, reservas e chat ficam só neste dispositivo e o pagamento fica “a aguardar pagamento”, sem fingir pagamento.</p></div>' +
    '<h2>Reservas</h2><div id="blist"></div><h2>Preços dos serviços</h2><div id="slist"></div>' +
    '<h2>Responder no chat</h2><label>Email do cliente</label><input id="to" placeholder="email do cliente"><label>Mensagem</label><textarea id="rtext"></textarea><p><button class="btn btn-primary" id="reply">Enviar resposta</button></p>';
  document.getElementById("reply").onclick = function () { var to = document.getElementById("to").value.trim(), t = document.getElementById("rtext").value.trim(); if (!to || !t) return; window.bestudio.addMessage({ email: to, to: to, from: "studio", text: t }); document.getElementById("rtext").value = ""; alert("Resposta guardada no chat do cliente."); };
  renderBookings(); renderServices();
}
</script></body></html>
