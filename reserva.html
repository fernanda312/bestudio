<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reservar | BESTUDIO Maputo</title><link rel="stylesheet" href="css/bestudio.css"><script src="js/config.js"></script><script src="js/services.js"></script><script src="js/app.js"></script></head><body>
<header><button class="menu" onclick="document.getElementById('drawer').classList.add('open')">≡</button><a class="logo" href="index.html">BESTUDIO</a><a class="icons" href="conta.html">○</a></header>
<div class="drawer" id="drawer" onclick="this.classList.remove('open')"><div class="box" onclick="event.stopPropagation()"><a href="index.html">Início</a><a href="servicos.html">Todos os serviços</a><a href="conta.html">Minha conta</a><a href="admin.html">Admin</a></div></div>
<main><p class="eyebrow">Reserva • Maputo</p><h1>Reservar sessão</h1><div id="box"></div></main>
<script>
var q = new URLSearchParams(location.search);
var s = window.bestudio.service(q.get("service"));
if (!s) { document.getElementById("box").innerHTML = "<p>Escolhe primeiro um serviço.</p><p><a class='btn' href='servicos.html'>Ver serviços</a></p>"; }
else {
  var qty = Math.max(1, parseInt(q.get("qty")) || 1), total = s.price * qty, fee = window.bestudio.fee();
  document.getElementById("box").innerHTML =
    '<div class="card"><img src="' + s.img + '" alt="' + s.name + '"><h3>' + s.name + '</h3><p>' + s.desc + '</p></div>' +
    '<div class="row"><p>Serviço</p><p>' + fmtMT(s.price) + " / " + s.unit + " × " + qty + '</p></div>' +
    '<div class="row"><p>Total do serviço</p><p><strong>' + fmtMT(total) + '</strong></p></div>' +
    '<div class="row"><p>Taxa de reserva (conta para o final)</p><p><strong>' + fmtMT(fee) + '</strong></p></div>' +
    '<div class="row"><p>Resto, no estúdio / na entrega</p><p>' + fmtMT(total - fee) + '</p></div>' +
    '<label>Data pretendida</label><input id="date" type="date">' +
    '<label>Hora pretendida</label><input id="time" type="time">' +
    '<label>Nome do projeto</label><input id="project" placeholder="Ex.: EP da banda, episódio 1 do podcast">' +
    '<label>Notas para o estúdio</label><textarea id="notes" placeholder="Conta-nos a tua visão, referências, prazos."></textarea>' +
    '<label>Número M-Pesa (para a taxa de reserva)</label><input id="phone" type="tel" placeholder="Ex.: 84XXXXXXX">' +
    '<div class="note"><p><strong>Antes de pagar:</strong> a taxa de reserva garante a tua sessão e conta para o pagamento final, não é um custo extra. Sem o projeto Supabase e as chaves do fornecedor de pagamento ligados, a reserva fica guardada como “a aguardar pagamento” e nenhum pagamento é fingido. Quando estiver ligado, este botão dispara o pedido M-Pesa para o número acima.</p></div>' +
    '<p id="msg"></p><p><button class="btn btn-primary" id="confirm">Confirmar reserva</button></p>' +
    '<p><button class="btn" id="chat">Falar com o estúdio antes de reservar</button></p>';
  document.getElementById("chat").onclick = function () {
    if (!window.bestudio.requireAccount("chat.html")) return; location.href = "chat.html";
  };
  document.getElementById("confirm").onclick = function () {
    var date = document.getElementById("date").value, time = document.getElementById("time").value;
    if (!date || !time) { document.getElementById("msg").textContent = "Escolhe a data e a hora pretendidas."; return; }
    if (!window.bestudio.session()) {
      window.bestudio.setPending({ next: location.href, service: s.id, qty: qty, date: date, time: time, project: document.getElementById("project").value, notes: document.getElementById("notes").value, phone: document.getElementById("phone").value });
      location.href = "conta.html"; return;
    }
    var b = window.bestudio.addBooking({ service: s.id, serviceName: s.name, qty: qty, total: total, fee: fee, rest: total - fee, date: date, time: time, project: document.getElementById("project").value, notes: document.getElementById("notes").value, phone: document.getElementById("phone").value, email: window.bestudio.session().email, payment: window.bestudio.supabaseConfigured() ? "por ligar ao fornecedor" : "a aguardar ligação do pagamento" });
    location.href = "conta.html?booked=" + b.id;
  };
  // Se voltou da conta com reserva pendente, repõe os campos.
  var p = window.bestudio.pending();
  if (p && p.service === s.id) { document.getElementById("date").value = p.date || ""; document.getElementById("time").value = p.time || ""; document.getElementById("project").value = p.project || ""; document.getElementById("notes").value = p.notes || ""; document.getElementById("phone").value = p.phone || ""; window.bestudio.clearPending(); }
}
</script></body></html>
