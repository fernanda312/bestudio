<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Minha conta | BESTUDIO Maputo</title><link rel="stylesheet" href="css/bestudio.css"><script src="js/config.js"></script><script src="js/services.js"></script><script src="js/app.js"></script></head><body>
<header><button class="menu" onclick="document.getElementById('drawer').classList.add('open')">≡</button><a class="logo" href="index.html">BESTUDIO</a><a class="icons" href="conta.html">Conta</a></header>
<div class="drawer" id="drawer" onclick="this.classList.remove('open')"><div class="box" onclick="event.stopPropagation()"><a href="index.html">Início</a><a href="servicos.html">Todos os serviços</a><a href="conta.html">Minha conta</a></div></div>
<main><p class="eyebrow">BESTUDIO • Maputo</p><h1>Minha conta</h1><div id="box"></div></main>
<script>
var s = window.bestudio.session();
if (!s) {
  document.getElementById("box").innerHTML =
    '<label>Email</label><input id="email" type="email"><label>Palavra-passe</label><input id="pw" type="password"><p id="msg"></p>' +
    '<p><button class="btn btn-primary" id="login">Entrar</button></p><p><button class="btn" id="create">Criar conta</button></p>';
  document.getElementById("create").onclick = function () { var r = window.bestudio.register(document.getElementById("email").value.trim(), document.getElementById("pw").value); if (!r.ok) { document.getElementById("msg").textContent = r.err; return; } afterLogin(); };
  document.getElementById("login").onclick = function () { var r = window.bestudio.login(document.getElementById("email").value.trim(), document.getElementById("pw").value); if (!r.ok) { document.getElementById("msg").textContent = r.err; return; } afterLogin(); };
  function afterLogin() {
    var p = window.bestudio.pending();
    // NÃO limpar aqui: a reserva pendente só é limpa pela página da reserva,
    // depois de repor data, hora, projeto, notas e M-Pesa. Limpar aqui era
    // o que fazia os campos voltarem vazios após criar a conta.
    if (p && p.next) { location.href = p.next; return; }
    location.reload();
  }
} else {
  var booked = new URLSearchParams(location.search).get("booked");
  var list = window.bestudio.myBookings();
  document.getElementById("box").innerHTML =
    (booked ? '<div class="note"><p><strong>Reserva guardada.</strong> A aguardar a taxa de reserva. O estúdio confirma a data e responde no chat.</p></div>' : "") +
    '<p class="muted">' + s.email + '</p>' +
    '<p><a class="btn btn-primary" href="chat.html">Chat com o estúdio</a></p><p><a class="linkarrow" href="servicos.html">Reservar outro serviço</a></p>' +
    '<h2>Minhas reservas</h2>' +
    (list.length ? list.map(function (b) {
      return '<div class="booking"><p><strong>' + b.serviceName + '</strong> — ' + b.date + ' às ' + b.time + '</p><p>Projeto: ' + (b.project || "—") + '</p><p>Total: ' + fmtMT(b.total) + ' • Taxa: ' + fmtMT(b.fee) + ' • Estado: ' + b.status + '</p></div>';
    }).join("") : "<p>Ainda não tens reservas.</p>") +
    '<p><button class="smallbtn" id="out">Sair da conta</button></p>' +
    (window.bestudio.isAdmin() ? '<p><a class="linkarrow" href="admin.html">Admin</a></p>' : "");
  document.getElementById("out").onclick = function () { window.bestudio.logout(); location.reload(); };
}
</script></body></html>
